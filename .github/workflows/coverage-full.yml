# Coverage of the full test suite (slow tests included), run by hand, in parallel
# jobs by test directory; each job uploads its report and Codecov merges them into
# the commit's coverage. Nothing else triggers it. The doctest job collects the
# package's modules with --doctest-modules and keeps the test modules out with the
# ignore glob (pytest matches the glob against each collected path, so a tests
# folder named beside the glob is dropped too); the test folders therefore have
# jobs of their own, and every tests folder of the package is named in exactly
# one job.
name: coverage-full

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        tests:
          - pianistpy/df pianistpy/profiles pianistpy/anisotropy
          - pianistpy/observables/tests/test_hard_limit.py pianistpy/observables/tests/test_table_vjp.py
          - pianistpy/observables --deselect pianistpy/observables/tests/test_hard_limit.py --deselect pianistpy/observables/tests/test_table_vjp.py
          - pianistpy/particles pianistpy/superposition pianistpy/units
          - pianistpy/inference pianistpy/tests pianistpy/numerics pianistpy/io
          - --doctest-modules pianistpy --ignore-glob='*/tests/*'
    env:
      PIANISTPY_CORES: "4"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . numpy==2.4.3 scipy==1.17.1 h5py==3.15.1 astropy==7.2.0 mpmath==1.3.0 sympy==1.14.0 jax==0.9.2 diffrax==0.7.2 optimistix==0.1.0 pytest pytest-cov
      - name: Tests with coverage
        run: python -m pytest -q -p no:cacheprovider --cov=pianistpy --cov-report=xml ${{ matrix.tests }}
      - name: Coverage report
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: full-suite
          fail_ci_if_error: false
