name: site

# Builds and publishes pianistpy.com: the landing page at the root and the
# manual under /docs/. Runs only in the public repository, and only on a
# release tag or by hand, never on a push: no run can fail unasked.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'barrytchiang/PIANISTpy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the package
        uses: actions/checkout@v4
      - name: Check out the notebooks
        uses: actions/checkout@v4
        with:
          repository: barrytchiang/PIANISTpy-notebooks
          path: notebooks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The manual is built from the package's docstrings, so the package is
      # installed; the notebooks are rendered from their stored outputs and
      # run nothing (nb_execution_mode = "off" in docs/conf.py).
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build the manual
        run: |
          python docs/tools/collect_notebooks.py notebooks docs/notebooks
          python -m sphinx -W --keep-going -b html docs site/docs
      - name: Assemble the site
        run: |
          python docs/tools/assemble_site.py docs site
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.repository == 'barrytchiang/PIANISTpy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
