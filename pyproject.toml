[build-system]
requires = ["setuptools>=77"]  # the license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "pianistpy"
description = "Spherical, non-rotating, velocity-anisotropic equilibrium models, self-consistently truncated in phase space."
readme = "README.md"
requires-python = ">=3.11"
# Lower bounds: the oldest version of each dependency that passes the full test
# suite, measured one package at a time with the others at their newest, and
# then all of them together as one environment on Python 3.11 (jax 0.6.0 brings
# equinox 0.13.8 and lineax 0.0.8 through diffrax), which passes. Python 3.11
# is the oldest numpy 2.3 supports; CI runs the suite on 3.11 (the standard
# list), 3.12 and 3.13.
dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.15.0",
    "h5py>=3.11.0",
    "astropy>=6.1.0",
    "mpmath>=1.1.0",
    "sympy>=1.2",
    # one test of the suite fails on jax 0.10.2, so the newest supported is below it
    "jax>=0.6.0,<0.10.2",
    "diffrax>=0.7.1",
    "optimistix>=0.1.0",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Barry T. Chiang", email = "barrytchiang@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]

[project.optional-dependencies]
# the test suite of an installed package: pytest --pyargs pianistpy
test = ["pytest"]

[project.urls]
Homepage = "https://pianistpy.com"
Documentation = "https://pianistpy.com/docs/"
Source = "https://github.com/barrytchiang/PIANISTpy"
Issues = "https://github.com/barrytchiang/PIANISTpy/issues"

[tool.setuptools.dynamic]
version = {attr = "pianistpy._version.__version__"}

[tool.setuptools.packages.find]
include = ["pianistpy*"]

[tool.setuptools.package-data]
pianistpy = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "A", "B", "PLW", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pianistpy"]

[tool.pytest.ini_options]
testpaths = ["pianistpy"]
addopts = "--doctest-modules"

[tool.mypy]
python_version = "3.11"
files = ["pianistpy"]
exclude = ["/tests/"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "h5py.*", "mpmath.*", "sympy.*", "astropy.*", "jax.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pianistpy"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_also = ["raise NotImplementedError"]
